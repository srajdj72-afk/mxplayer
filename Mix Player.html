<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0c10">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="MX Player">
<title>MX Player</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none; }
  html, body { 
    height:100%; overflow:hidden;
    font-family:'Inter',sans-serif;
    background:#000; color:#eef2f6;
  }
  body { display:flex; flex-direction:column; }

  /* ===== TOP BAR ===== */
  .top-bar {
    display:flex; align-items:center; gap:10px;
    padding:10px 14px;
    background: linear-gradient(180deg, rgba(0,0,0,.95), rgba(0,0,0,.6));
    position:absolute; top:0; left:0; right:0;
    z-index:50; transition: transform .3s, opacity .3s;
  }
  .top-bar.hidden { transform: translateY(-100%); opacity:0; }
  .logo-icon {
    background: linear-gradient(135deg,#00c6fb,#005bea);
    width:38px; height:38px; border-radius:11px;
    display:flex; align-items:center; justify-content:center;
    font-size:16px; font-weight:800; color:#fff;
    box-shadow:0 4px 14px rgba(0,91,234,.5);
    flex-shrink:0;
  }
  .app-title { font-weight:700; font-size:17px; letter-spacing:-.3px; }
  .app-title span {
    background: linear-gradient(to right,#00c6fb,#005bea);
    -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  }
  .top-spacer { flex:1; }
  .top-btn {
    background: rgba(255,255,255,.1);
    border:none; color:#fff;
    width:36px; height:36px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; cursor:pointer;
    backdrop-filter: blur(10px);
    transition: background .15s;
  }
  .top-btn:active { background: rgba(0,198,251,.4); }

  /* ===== VIDEO STAGE (pinch zoom) ===== */
  .stage {
    position:relative; flex:1;
    background:#000; overflow:hidden;
    display:flex; align-items:center; justify-content:center;
    touch-action: none;
  }
  #videoPlayer {
    width:100%; height:100%;
    object-fit:contain;
    background:#000;
    transform-origin: center center;
    transition: transform .05s linear;
    will-change: transform;
  }
  #videoPlayer.zoomed { cursor: grab; }

  /* ===== CENTER PLAY BUTTON ===== */
  .center-play {
    position:absolute; inset:0;
    display:flex; align-items:center; justify-content:center;
    pointer-events:none; z-index:5;
  }
  .center-play i {
    font-size:80px; color: rgba(255,255,255,.9);
    filter: drop-shadow(0 0 30px rgba(0,198,251,.8));
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%,100% { transform: scale(1); opacity:1; }
    50% { transform: scale(1.1); opacity:.7; }
  }
  .stage.playing .center-play { display:none; }

  /* ===== ZOOM INDICATOR ===== */
  .zoom-indicator {
    position:absolute; top:50%; left:50%;
    transform: translate(-50%,-50%);
    background: rgba(0,0,0,.75);
    color:#fff; font-weight:700; font-size:14px;
    padding:8px 16px; border-radius:30px;
    border:1px solid rgba(0,198,251,.5);
    opacity:0; transition: opacity .2s;
    pointer-events:none; z-index:20;
  }
  .zoom-indicator.show { opacity:1; }

  /* ===== CONTROL PANEL (bottom, fixed center layout) ===== */
  .controls-panel {
    position:absolute; bottom:0; left:0; right:0;
    background: linear-gradient(to top, rgba(0,0,0,.98), rgba(0,0,0,.75) 70%, transparent);
    padding: 50px 12px 14px;
    z-index:40;
    transition: transform .3s, opacity .3s;
    display:flex; flex-direction:column; gap:10px;
  }
  .controls-panel.hidden {
    transform: translateY(100%); opacity:0; pointer-events:none;
  }

  /* Progress row */
  .progress-row {
    display:flex; align-items:center; gap:10px;
    padding: 0 4px;
  }
  .time-text {
    font-size:12px; font-weight:600; color:#dce6f0;
    font-variant-numeric:tabular-nums;
    min-width:44px; text-align:center;
  }
  .progress-bar {
    flex:1; height:5px; background: rgba(255,255,255,.2);
    border-radius:10px; cursor:pointer; position:relative;
    touch-action: none;
  }
  .progress-fill {
    height:100%; background: linear-gradient(90deg,#00c6fb,#005bea);
    border-radius:10px; width:0%;
  }
  .progress-knob {
    position:absolute; top:50%; right:-8px;
    transform: translateY(-50%);
    width:16px; height:16px; background:#fff;
    border-radius:50%; box-shadow:0 0 12px #00c6fb;
    pointer-events:none;
  }

  /* Big main controls — CENTERED */
  .main-controls {
    display:flex; align-items:center; justify-content:center;
    gap:10px; padding: 4px 0;
  }
  .main-btn {
    background: rgba(255,255,255,.1);
    border:1px solid rgba(255,255,255,.1);
    color:#fff; font-size:16px;
    width:48px; height:48px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:.15s;
    backdrop-filter: blur(6px);
    flex-shrink:0;
  }
  .main-btn:active { transform: scale(.92); background: rgba(0,198,251,.4); }
  .main-btn.big {
    width:64px; height:64px; font-size:26px;
    background: linear-gradient(135deg,#00c6fb,#005bea);
    border:none;
    box-shadow: 0 8px 24px rgba(0,91,234,.5);
  }
  .main-btn.big:active { transform: scale(.9); }
  .main-btn.active {
    background: rgba(0,198,251,.4);
    border-color:#00c6fb; color:#00c6fb;
  }

  /* Secondary controls — row below */
  .secondary-controls {
    display:flex; align-items:center; justify-content:space-between;
    gap:6px; padding: 0 4px;
    flex-wrap: wrap;
  }
  .ctrl-group {
    display:flex; align-items:center; gap:6px;
  }
  .mini-btn {
    background: rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.08);
    color:#eef2f6; font-size:13px;
    width:40px; height:40px; border-radius:12px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer; transition:.15s;
    flex-shrink:0;
  }
  .mini-btn:active { background: rgba(0,198,251,.3); transform: scale(.94); }
  .mini-btn.active {
    background: rgba(0,198,251,.35);
    border-color:#00c6fb; color:#00c6fb;
  }
  .select-btn {
    background: rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.08);
    color:#eef2f6; font-size:11px;
    padding:8px 10px; border-radius:12px;
    cursor:pointer; font-family:'Inter',sans-serif;
    font-weight:600; outline:none;
    max-width:110px;
  }
  .select-btn option { background:#10131a; }

  /* Volume slider inline */
  .vol-slider {
    width:70px; height:4px; -webkit-appearance:none;
    background: rgba(255,255,255,.25); border-radius:4px;
    outline:none; cursor:pointer;
  }
  .vol-slider::-webkit-slider-thumb {
    -webkit-appearance:none; width:14px; height:14px;
    background:#fff; border-radius:50%;
    box-shadow:0 0 10px #00c6fb;
  }

  /* ===== LIBRARY PANEL (slide-up) ===== */
  .library-panel {
    position:absolute; inset:0;
    background: #0a0c10;
    z-index:100;
    display:flex; flex-direction:column;
    transform: translateY(100%);
    transition: transform .35s cubic-bezier(.4,0,.2,1);
  }
  .library-panel.open { transform: translateY(0); }
  .lib-header {
    display:flex; align-items:center; gap:10px;
    padding:14px 16px;
    border-bottom:1px solid rgba(255,255,255,.06);
    background:#10131a;
    flex-shrink:0;
  }
  .lib-title { font-weight:700; font-size:16px; flex:1; }
  .lib-title small { display:block; font-size:11px; color:#6b7b8e; font-weight:500; margin-top:2px; }
  .close-lib {
    background: rgba(255,255,255,.08); border:none;
    width:38px; height:38px; border-radius:50%;
    color:#fff; font-size:15px; cursor:pointer;
  }
  .lib-actions {
    padding:12px 16px;
    display:flex; gap:8px; flex-wrap:wrap;
    border-bottom:1px solid rgba(255,255,255,.06);
    flex-shrink:0;
  }
  .add-btn {
    background: linear-gradient(135deg,#1f2632,#161b24);
    border:1px solid rgba(0,198,251,.35);
    color:#fff; font-size:12px; font-weight:600;
    padding:10px 16px; border-radius:30px;
    display:inline-flex; align-items:center; gap:7px;
    cursor:pointer; transition:.15s;
  }
  .add-btn:active { transform: scale(.96); background: linear-gradient(135deg,#005bea,#00c6fb); }
  .add-btn.green { border-color: rgba(46,204,113,.4); }
  .add-btn.green:active { background: linear-gradient(135deg,#1e8449,#2ecc71); }
  #folderInput, #fileInput { display:none; }

  .media-grid {
    flex:1; overflow-y:auto;
    padding: 14px 16px 100px;
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(140px,1fr));
    gap:12px;
    -webkit-overflow-scrolling: touch;
  }
  .media-grid::-webkit-scrollbar { width:6px; }
  .media-grid::-webkit-scrollbar-thumb { background:#2a3340; border-radius:10px; }

  .media-card {
    background:#161b24; border-radius:14px;
    padding:14px 10px;
    display:flex; flex-direction:column;
    align-items:center; gap:8px;
    cursor:pointer; transition:.15s;
    border:1px solid rgba(255,255,255,.04);
    text-align:center; position:relative;
    overflow:hidden;
  }
  .media-card:active { transform: scale(.96); background:#1f2632; }
  .media-card.active { border-color:#00c6fb; background:#1a2332; box-shadow:0 0 20px rgba(0,198,251,.25); }
  .media-card i { font-size:34px; color:#00c6fb; }
  .media-card .name {
    font-size:12px; font-weight:500; color:#dce6f0;
    width:100%; word-break:break-word;
    display:-webkit-box; -webkit-line-clamp:2;
    -webkit-box-orient:vertical; overflow:hidden;
    line-height:1.3;
  }
  .media-card .size {
    font-size:10px; color:#6b7b8e; font-weight:500;
  }
  .media-card .num {
    position:absolute; top:6px; left:8px;
    background: rgba(0,198,251,.9);
    color:#000; font-size:9px; font-weight:800;
    padding:2px 7px; border-radius:6px;
  }

  .empty-state {
    grid-column: 1/-1;
    text-align:center; padding:50px 20px;
    color:#6b7b8e; line-height:1.8; font-size:13px;
  }
  .empty-state i {
    font-size:52px; display:block;
    color:#00c6fb; opacity:.5; margin-bottom:14px;
  }

  /* ===== SETTINGS POPUP ===== */
  .popup {
    position:absolute; inset:0;
    background: rgba(0,0,0,.75);
    z-index:200;
    display:none; align-items:center; justify-content:center;
    padding:20px;
    backdrop-filter: blur(6px);
  }
  .popup.show { display:flex; }
  .popup-card {
    background:#10131a; border-radius:20px;
    padding:20px; width:100%; max-width:340px;
    border:1px solid rgba(255,255,255,.08);
    box-shadow: 0 20px 50px rgba(0,0,0,.8);
  }
  .popup-title {
    font-weight:700; font-size:16px; margin-bottom:16px;
    display:flex; align-items:center; gap:10px;
  }
  .popup-title i { color:#00c6fb; }
  .popup-row {
    display:flex; align-items:center; justify-content:space-between;
    padding:12px 0;
    border-bottom:1px solid rgba(255,255,255,.05);
    font-size:13px;
  }
  .popup-row:last-of-type { border-bottom:none; }
  .popup-row label { color:#b0c4de; font-weight:500; }
  .popup-row select, .popup-row input {
    background:#1a1f2b;
    border:1px solid rgba(255,255,255,.1);
    color:#fff; padding:7px 10px;
    border-radius:9px; font-family:'Inter',sans-serif;
    font-size:12px; outline:none;
  }
  .popup-close {
    width:100%; margin-top:16px;
    background: linear-gradient(135deg,#00c6fb,#005bea);
    color:#fff; border:none;
    padding:12px; border-radius:12px;
    font-weight:700; font-size:14px;
    cursor:pointer; font-family:'Inter',sans-serif;
  }
  .popup-close:active { transform: scale(.97); }

  /* Toast */
  .toast {
    position:absolute; top:80px; left:50%;
    transform: translateX(-50%);
    background: rgba(0,198,251,.95);
    color:#000; font-weight:700; font-size:13px;
    padding:8px 18px; border-radius:30px;
    z-index:300; opacity:0;
    transition: opacity .25s;
    pointer-events:none;
    white-space: nowrap;
  }
  .toast.show { opacity:1; }

  /* Rotation lock icon overlay */
  .rotate-lock-badge {
    position:absolute; top:70px; right:16px;
    background: rgba(0,198,251,.9); color:#000;
    width:34px; height:34px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:14px; z-index:60;
    opacity:0; transition: opacity .3s;
  }
  .rotate-lock-badge.show { opacity:1; }

  @media (max-width:400px) {
    .main-btn { width:44px; height:44px; font-size:15px; }
    .main-btn.big { width:60px; height:60px; font-size:24px; }
    .mini-btn { width:36px; height:36px; font-size:12px; }
    .vol-slider { width:55px; }
    .select-btn { max-width:90px; font-size:10px; }
    .app-title { font-size:15px; }
    .time-text { font-size:11px; min-width:38px; }
  }
</style>
</head>
<body>

<!-- ================= TOP BAR ================= -->
<div class="top-bar" id="topBar">
  <div class="logo-icon">MX</div>
  <div class="app-title">MX <span>Player</span></div>
  <div class="top-spacer"></div>
  <button class="top-btn" id="openLibraryBtn" title="Library"><i class="fas fa-folder-open"></i></button>
  <button class="top-btn" id="openSettingsBtn" title="Settings"><i class="fas fa-sliders"></i></button>
</div>

<!-- ================= VIDEO STAGE ================= -->
<div class="stage" id="stage">
  <video id="videoPlayer" playsinline preload="metadata" webkit-playsinline></video>
  
  <div class="center-play" id="centerPlay">
    <i class="fas fa-play-circle"></i>
  </div>

  <div class="zoom-indicator" id="zoomIndicator">1.0x</div>
  <div class="rotate-lock-badge" id="rotateLockBadge"><i class="fas fa-lock"></i></div>
  <div class="toast" id="toast"></div>

  <!-- ============= CONTROLS PANEL (Bottom fixed) ============= -->
  <div class="controls-panel" id="controlsPanel">
    
    <!-- Progress row -->
    <div class="progress-row">
      <span class="time-text" id="curTime">0:00</span>
      <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill">
          <div class="progress-knob"></div>
        </div>
      </div>
      <span class="time-text" id="totTime">0:00</span>
    </div>

    <!-- MAIN BIG CONTROLS (Centered) -->
    <div class="main-controls">
      <button class="main-btn" id="rewind10Btn" title="10s peechhe"><i class="fas fa-rotate-left"></i></button>
      <button class="main-btn" id="rewind5Btn" title="5s peechhe"><i class="fas fa-backward"></i></button>
      <button class="main-btn big" id="playPauseBtn"><i class="fas fa-play"></i></button>
      <button class="main-btn" id="forward5Btn" title="5s aage"><i class="fas fa-forward"></i></button>
      <button class="main-btn" id="forward10Btn" title="10s aage"><i class="fas fa-rotate-right"></i></button>
    </div>

    <!-- SECONDARY CONTROLS -->
    <div class="secondary-controls">
      <div class="ctrl-group">
        <button class="mini-btn" id="muteBtn"><i class="fas fa-volume-up"></i></button>
        <input type="range" class="vol-slider" id="volSlider" min="0" max="1" step="0.01" value="1">
      </div>
      <div class="ctrl-group">
        <button class="mini-btn" id="loopBtn" title="Repeat / Loop"><i class="fas fa-repeat"></i></button>
        <button class="mini-btn" id="speedBtn" title="Speed">1x</button>
        <button class="mini-btn" id="rotateBtn" title="Rotate"><i class="fas fa-rotate"></i></button>
        <button class="mini-btn" id="fitBtn" title="Fit/Zoom"><i class="fas fa-expand-arrows-alt"></i></button>
        <button class="mini-btn" id="fullscreenBtn" title="Fullscreen"><i class="fas fa-expand"></i></button>
      </div>
    </div>
  </div>
</div>

<!-- ================= LIBRARY PANEL ================= -->
<div class="library-panel" id="libraryPanel">
  <div class="lib-header">
    <div class="lib-title">
      Meri Movies
      <small id="videoCount">0 videos</small>
    </div>
    <button class="close-lib" id="closeLibBtn"><i class="fas fa-times"></i></button>
  </div>

  <div class="lib-actions">
    <label for="folderInput" class="add-btn"><i class="fas fa-folder-plus"></i> Add Folder</label>
    <label for="fileInput" class="add-btn green"><i class="fas fa-plus-circle"></i> Add Videos</label>
    <input type="file" id="folderInput" webkitdirectory directory multiple>
    <input type="file" id="fileInput" accept="video/*" multiple>
  </div>

  <div class="media-grid" id="mediaGrid">
    <div class="empty-state">
      <i class="fas fa-film"></i>
      Abhi koi movie nahi hai.<br>
      <strong>"Add Folder"</strong> ya <strong>"Add Videos"</strong> pe tap karein.
    </div>
  </div>
</div>

<!-- ================= SETTINGS POPUP ================= -->
<div class="popup" id="settingsPopup">
  <div class="popup-card">
    <div class="popup-title"><i class="fas fa-sliders"></i> Settings</div>
    
    <div class="popup-row">
      <label>Audio Track</label>
      <select id="audioTrackSelect">
        <option value="default">🔊 Default</option>
        <option value="hindi">🇮🇳 Hindi</option>
        <option value="english">🇬🇧 English</option>
      </select>
    </div>

    <div class="popup-row">
      <label>Subtitles</label>
      <select id="subtitleSelect">
        <option value="off">💬 Off</option>
        <option value="english">English</option>
        <option value="hindi">Hindi</option>
      </select>
    </div>

    <div class="popup-row">
      <label>Playback Speed</label>
      <select id="speedSelect">
        <option value="0.25">0.25x</option>
        <option value="0.5">0.5x</option>
        <option value="0.75">0.75x</option>
        <option value="1" selected>1x (Normal)</option>
        <option value="1.25">1.25x</option>
        <option value="1.5">1.5x</option>
        <option value="2">2x</option>
      </select>
    </div>

    <div class="popup-row">
      <label>Aspect Ratio</label>
      <select id="aspectSelect">
        <option value="contain">Contain (Fit)</option>
        <option value="cover">Cover (Fill)</option>
        <option value="fill">Stretch</option>
      </select>
    </div>

    <button class="popup-close" id="closeSettingsBtn">Done</button>
  </div>
</div>

<script>
(function() {
  "use strict";

  // ============ ELEMENTS ============
  const video = document.getElementById('videoPlayer');
  const stage = document.getElementById('stage');
  const topBar = document.getElementById('topBar');
  const controlsPanel = document.getElementById('controlsPanel');
  const centerPlay = document.getElementById('centerPlay');
  const playPauseBtn = document.getElementById('playPauseBtn');
  const rewind5Btn = document.getElementById('rewind5Btn');
  const rewind10Btn = document.getElementById('rewind10Btn');
  const forward5Btn = document.getElementById('forward5Btn');
  const forward10Btn = document.getElementById('forward10Btn');
  const muteBtn = document.getElementById('muteBtn');
  const volSlider = document.getElementById('volSlider');
  const loopBtn = document.getElementById('loopBtn');
  const speedBtn = document.getElementById('speedBtn');
  const rotateBtn = document.getElementById('rotateBtn');
  const fitBtn = document.getElementById('fitBtn');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  const curTimeEl = document.getElementById('curTime');
  const totTimeEl = document.getElementById('totTime');
  const progressBar = document.getElementById('progressBar');
  const progressFill = document.getElementById('progressFill');
  const libraryPanel = document.getElementById('libraryPanel');
  const openLibraryBtn = document.getElementById('openLibraryBtn');
  const closeLibBtn = document.getElementById('closeLibBtn');
  const folderInput = document.getElementById('folderInput');
  const fileInput = document.getElementById('fileInput');
  const mediaGrid = document.getElementById('mediaGrid');
  const videoCount = document.getElementById('videoCount');
  const settingsPopup = document.getElementById('settingsPopup');
  const openSettingsBtn = document.getElementById('openSettingsBtn');
  const closeSettingsBtn = document.getElementById('closeSettingsBtn');
  const speedSelect = document.getElementById('speedSelect');
  const aspectSelect = document.getElementById('aspectSelect');
  const zoomIndicator = document.getElementById('zoomIndicator');
  const toast = document.getElementById('toast');
  const rotateLockBadge = document.getElementById('rotateLockBadge');

  // ============ STATE ============
  let isDraggingProgress = false;
  let controlsTimeout = null;
  let allVideos = [];
  let isLooping = false;
  let currentSpeed = 1;
  let rotationLocked = false;
  let aspectMode = 'contain';

  // Zoom state
  let scale = 1;
  let translateX = 0;
  let translateY = 0;
  let startDistance = 0;
  let startScale = 1;
  let startX = 0, startY = 0;
  let startTouchX = 0, startTouchY = 0;
  let isPanning = false;
  const MAX_SCALE = 4;
  const MIN_SCALE = 1;

  // ============ UTILS ============
  function fmt(s) {
    if (!isFinite(s) || isNaN(s)) return '0:00';
    const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), sec = Math.floor(s%60);
    return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`
                 : `${m}:${String(sec).padStart(2,'0')}`;
  }

  function showToast(msg) {
    toast.textContent = msg;
    toast.classList.add('show');
    clearTimeout(toast._t);
    toast._t = setTimeout(() => toast.classList.remove('show'), 1300);
  }

  function updatePlayIcon() {
    playPauseBtn.querySelector('i').className = video.paused ? 'fas fa-play' : 'fas fa-pause';
    stage.classList.toggle('playing', !video.paused && !!video.src);
  }

  function updateVolumeIcon() {
    const i = muteBtn.querySelector('i');
    if (video.muted || video.volume === 0) i.className = 'fas fa-volume-mute';
    else if (video.volume < 0.5) i.className = 'fas fa-volume-down';
    else i.className = 'fas fa-volume-up';
  }

  function updateProgress() {
    if (!video.duration) return;
    const p = (video.currentTime / video.duration) * 100;
    progressFill.style.width = p + '%';
    curTimeEl.textContent = fmt(video.currentTime);
  }

  function applyVideoTransform() {
    video.style.transform = `translate(${translateX}px, ${translateY}px) scale(${scale})`;
    zoomIndicator.textContent = scale.toFixed(1) + 'x';
    if (scale > 1) video.classList.add('zoomed');
    else video.classList.remove('zoomed');
  }

  function resetZoom() {
    scale = 1; translateX = 0; translateY = 0;
    applyVideoTransform();
  }

  // ============ VIDEO EVENTS ============
  video.addEventListener('loadedmetadata', () => {
    totTimeEl.textContent = fmt(video.duration);
    updateProgress();
    resetZoom();
    if (rotationLocked === false) {
      // Auto rotate to landscape if video is landscape
      if (video.videoWidth > video.videoHeight && screen.orientation && screen.orientation.lock) {
        // silent — only if supported
      }
    }
  });

  video.addEventListener('timeupdate', () => { if (!isDraggingProgress) updateProgress(); });
  video.addEventListener('play', () => { updatePlayIcon(); hideControlsSoon(); });
  video.addEventListener('pause', () => { updatePlayIcon(); showControls(); clearTimeout(controlsTimeout); });
  video.addEventListener('volumechange', () => {
    volSlider.value = video.muted ? 0 : video.volume;
    updateVolumeIcon();
  });
  video.addEventListener('ended', () => {
    updatePlayIcon();
    showControls();
    if (isLooping) { video.currentTime = 0; video.play(); }
  });
  video.addEventListener('dblclick', () => toggleFullscreen());
  video.addEventListener('click', () => { toggleControls(); });

  // ============ PROGRESS BAR ============
  function seekAt(clientX) {
    const rect = progressBar.getBoundingClientRect();
    let p = (clientX - rect.left) / rect.width;
    p = Math.max(0, Math.min(1, p));
    if (video.duration) video.currentTime = p * video.duration;
    updateProgress();
  }

  progressBar.addEventListener('mousedown', e => {
    isDraggingProgress = true; seekAt(e.clientX);
    const mv = ev => isDraggingProgress && seekAt(ev.clientX);
    const up = () => { isDraggingProgress = false; document.removeEventListener('mousemove', mv); document.removeEventListener('mouseup', up); };
    document.addEventListener('mousemove', mv); document.addEventListener('mouseup', up);
  });

  progressBar.addEventListener('touchstart', e => { isDraggingProgress = true; seekAt(e.touches[0].clientX); showControls(); }, {passive:true});
  progressBar.addEventListener('touchmove', e => { if (isDraggingProgress) seekAt(e.touches[0].clientX); }, {passive:true});
  progressBar.addEventListener('touchend', () => isDraggingProgress = false);

  // ============ CONTROL BUTTONS ============
  playPauseBtn.addEventListener('click', () => {
    if (!video.src) { showToast('Pehle video add karein'); openLibrary(); return; }
    video.paused ? video.play().catch(e => showToast('Play error')) : video.pause();
    showControls();
  });

  rewind5Btn.addEventListener('click', () => { video.currentTime = Math.max(0, video.currentTime - 5); updateProgress(); showControls(); });
  rewind10Btn.addEventListener('click', () => { video.currentTime = Math.max(0, video.currentTime - 10); updateProgress(); showControls(); });
  forward5Btn.addEventListener('click', () => { video.currentTime = Math.min(video.duration || 0, video.currentTime + 5); updateProgress(); showControls(); });
  forward10Btn.addEventListener('click', () => { video.currentTime = Math.min(video.duration || 0, video.currentTime + 10); updateProgress(); showControls(); });

  muteBtn.addEventListener('click', () => { video.muted = !video.muted; updateVolumeIcon(); showControls(); });
  volSlider.addEventListener('input', e => { video.volume = parseFloat(e.target.value); video.muted = false; updateVolumeIcon(); });

  // LOOP / REPEAT
  loopBtn.addEventListener('click', () => {
    isLooping = !isLooping;
    video.loop = isLooping;
    loopBtn.classList.toggle('active', isLooping);
    showToast(isLooping ? '🔁 Repeat ON' : 'Repeat OFF');
  });

  // SPEED (quick cycle)
  const speeds = [0.5, 0.75, 1, 1.25, 1.5, 2];
  speedBtn.addEventListener('click', () => {
    const idx = speeds.indexOf(currentSpeed);
    const next = speeds[(idx + 1) % speeds.length];
    currentSpeed = next;
    video.playbackRate = next;
    speedBtn.textContent = next + 'x';
    speedSelect.value = next;
    showToast('Speed: ' + next + 'x');
  });

  // ROTATE (manual screen rotation via CSS)
  let rotationDeg = 0;
  rotateBtn.addEventListener('click', () => {
    rotationDeg = (rotationDeg + 90) % 360;
    // Rotate video only
    video.style.transition = 'transform .3s';
    const oldTransform = `translate(${translateX}px, ${translateY}px) scale(${scale}) rotate(${rotationDeg}deg)`;
    video.style.transform = oldTransform;
    setTimeout(() => { video.style.transition = 'transform .05s linear'; }, 320);
    showToast('🔄 Rotate ' + rotationDeg + '°');
  });

  // FIT / ZOOM cycle: contain → cover → fill
  const fitModes = ['contain', 'cover', 'fill'];
  const fitIcons = ['fa-expand-arrows-alt', 'fa-crop-alt', 'fa-arrows-alt-h'];
  let fitIdx = 0;
  fitBtn.addEventListener('click', () => {
    fitIdx = (fitIdx + 1) % fitModes.length;
    video.style.objectFit = fitModes[fitIdx];
    fitBtn.querySelector('i').className = 'fas ' + fitIcons[fitIdx];
    showToast('Fit: ' + fitModes[fitIdx]);
  });

  // FULLSCREEN
  function toggleFullscreen() {
    if (!document.fullscreenElement) {
      (stage.requestFullscreen || stage.webkitRequestFullscreen || stage.msRequestFullscreen).call(stage)
        .then(() => {
          if (screen.orientation && screen.orientation.lock) {
            screen.orientation.lock('landscape').catch(() => {});
          }
        }).catch(err => showToast('Fullscreen error'));
      fullscreenBtn.querySelector('i').className = 'fas fa-compress';
    } else {
      (document.exitFullscreen || document.webkitExitFullscreen || document.msExitFullscreen).call(document);
      fullscreenBtn.querySelector('i').className = 'fas fa-expand';
    }
  }
  fullscreenBtn.addEventListener('click', toggleFullscreen);

  // ============ AUTO-HIDE CONTROLS ============
  function showControls() {
    topBar.classList.remove('hidden');
    controlsPanel.classList.remove('hidden');
    clearTimeout(controlsTimeout);
    if (!video.paused) hideControlsSoon();
  }
  function hideControlsSoon() {
    clearTimeout(controlsTimeout);
    controlsTimeout = setTimeout(() => {
      if (!video.paused) {
        topBar.classList.add('hidden');
        controlsPanel.classList.add('hidden');
      }
    }, 3000);
  }
  function toggleControls() {
    if (controlsPanel.classList.contains('hidden')) showControls();
    else {
      topBar.classList.add('hidden');
      controlsPanel.classList.add('hidden');
      clearTimeout(controlsTimeout);
    }
  }

  stage.addEventListener('touchstart', () => { if (video.src) showControls(); }, {passive:true});
  stage.addEventListener('mousemove', () => { if (video.src) showControls(); });

  // ============ PINCH TO ZOOM + PAN ============
  function getTouchDist(t1, t2) {
    const dx = t1.clientX - t2.clientX;
    const dy = t1.clientY - t2.clientY;
    return Math.hypot(dx, dy);
  }

  stage.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      startDistance = getTouchDist(e.touches[0], e.touches[1]);
      startScale = scale;
      e.preventDefault();
    } else if (e.touches.length === 1 && scale > 1) {
      isPanning = true;
      startTouchX = e.touches[0].clientX;
      startTouchY = e.touches[0].clientY;
      startX = translateX;
      startY = translateY;
    }
  }, {passive:false});

  stage.addEventListener('touchmove', e => {
    if (e.touches.length === 2) {
      e.preventDefault();
      const dist = getTouchDist(e.touches[0], e.touches[1]);
      let newScale = startScale * (dist / startDistance);
      newScale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, newScale));
      scale = newScale;
      zoomIndicator.classList.add('show');
      applyVideoTransform();
    } else if (e.touches.length === 1 && isPanning && scale > 1) {
      e.preventDefault();
      const dx = e.touches[0].clientX - startTouchX;
      const dy = e.touches[0].clientY - startTouchY;
      translateX = startX + dx;
      translateY = startY + dy;
      // Bound translation
      const maxT = (scale - 1) * (stage.clientWidth / 2);
      translateX = Math.max(-maxT, Math.min(maxT, translateX));
      const maxTY = (scale - 1) * (stage.clientHeight / 2);
      translateY = Math.max(-maxTY, Math.min(maxTY, translateY));
      applyVideoTransform();
    }
  }, {passive:false});

  stage.addEventListener('touchend', e => {
    if (e.touches.length < 2) {
      zoomIndicator.classList.remove('show');
    }
    if (e.touches.length === 0) {
      isPanning = false;
      if (scale <= 1.02) resetZoom();
    }
  });

  // Double tap zoom toggle
  let lastTap = 0;
  stage.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTap < 300 && e.touches.length === 0) {
      if (scale > 1) resetZoom();
      else { scale = 2; applyVideoTransform(); }
      showToast(scale > 1 ? '🔍 Zoomed' : 'Fit');
    }
    lastTap = now;
  });

  // Mouse wheel zoom
  stage.addEventListener('wheel', e => {
    e.preventDefault();
    const delta = e.deltaY < 0 ? 0.15 : -0.15;
    scale = Math.max(MIN_SCALE, Math.min(MAX_SCALE, scale + delta));
    if (scale <= 1.02) resetZoom();
    else applyVideoTransform();
  }, {passive:false});

  // ============ LIBRARY ============
  function openLibrary() {
    libraryPanel.classList.add('open');
  }
  function closeLibrary() {
    libraryPanel.classList.remove('open');
  }
  openLibraryBtn.addEventListener('click', openLibrary);
  closeLibBtn.addEventListener('click', closeLibrary);

  function isVideoFile(f) {
    return f.type.startsWith('video/') || /\.(mp4|webm|mkv|mov|avi|m4v|ogv|flv|wmv|3gp)$/i.test(f.name);
  }

  function addFiles(files) {
    const vids = Array.from(files).filter(isVideoFile);
    if (!vids.length) { showToast('Koi video nahi mili'); return; }
    vids.forEach(f => {
      if (!allVideos.some(v => v.name === f.name && v.size === f.size)) allVideos.push(f);
    });
    renderGrid();
    showToast(vids.length + ' video add hui');
  }

  function renderGrid() {
    mediaGrid.innerHTML = '';
    videoCount.textContent = allVideos.length + ' video' + (allVideos.length !== 1 ? 's' : '');

    if (!allVideos.length) {
      mediaGrid.innerHTML = `<div class="empty-state"><i class="fas fa-film"></i>
        Abhi koi movie nahi hai.<br><strong>"Add Folder"</strong> ya <strong>"Add Videos"</strong> pe tap karein.</div>`;
      return;
    }

    allVideos.sort((a,b) => a.name.localeCompare(b.name));

    allVideos.forEach((file, i) => {
      const card = document.createElement('div');
      card.className = 'media-card';
      const sizeMB = file.size / (1024*1024);
      const sizeStr = sizeMB > 1024 ? (sizeMB/1024).toFixed(2)+' GB' : sizeMB.toFixed(0)+' MB';
      card.innerHTML = `
        <div class="num">${i+1}</div>
        <i class="fas fa-file-video"></i>
        <div class="name">${file.name}</div>
        <div class="size">${sizeStr}</div>
      `;
      card.addEventListener('click', () => {
        playFile(file, card);
      });
      mediaGrid.appendChild(card);
    });
  }

  function playFile(file, card) {
    if (video.src && video.src.startsWith('blob:')) URL.revokeObjectURL(video.src);
    const url = URL.createObjectURL(file);
    video.src = url;
    video.load();
    resetZoom();
    rotationDeg = 0;
    video.play().then(() => closeLibrary()).catch(err => {
      showToast('Play nahi hua, tap karein');
      closeLibrary();
    });
    document.querySelectorAll('.media-card').forEach(c => c.classList.remove('active'));
    if (card) card.classList.add('active');
  }

  folderInput.addEventListener('change', e => { if (e.target.files.length) addFiles(e.target.files); e.target.value=''; });
  fileInput.addEventListener('change', e => { if (e.target.files.length) addFiles(e.target.files); e.target.value=''; });

  // ============ SETTINGS ============
  openSettingsBtn.addEventListener('click', () => settingsPopup.classList.add('show'));
  closeSettingsBtn.addEventListener('click', () => settingsPopup.classList.remove('show'));

  speedSelect.addEventListener('change', e => {
    currentSpeed = parseFloat(e.target.value);
    video.playbackRate = currentSpeed;
    speedBtn.textContent = currentSpeed + 'x';
  });

  aspectSelect.addEventListener('change', e => {
    video.style.objectFit = e.target.value;
    aspectMode = e.target.value;
  });

  // ============ KEYBOARD (desktop) ============
  document.addEventListener('keydown', e => {
    if (['INPUT','SELECT','TEXTAREA'].includes(e.target.tagName)) return;
    switch(e.key) {
      case ' ': e.preventDefault(); if (video.src) video.paused ? video.play() : video.pause(); break;
      case 'ArrowLeft': video.currentTime = Math.max(0, video.currentTime - 10); updateProgress(); break;
      case 'ArrowRight': video.currentTime = Math.min(video.duration||0, video.currentTime + 10); updateProgress(); break;
      case 'm': video.muted = !video.muted; updateVolumeIcon(); break;
      case 'f': toggleFullscreen(); break;
    }
  });

  // ============ INIT ============
  updateVolumeIcon();
  updatePlayIcon();
  volSlider.value = video.volume;
  showControls();
  setTimeout(() => { if (!video.src) hideControlsSoon(); }, 4000);

  window.addEventListener('beforeunload', () => {
    if (video.src && video.src.startsWith('blob:')) URL.revokeObjectURL(video.src);
  });

})();
</script>
</body>
</html>
